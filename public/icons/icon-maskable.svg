<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="waveGradMask" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glowMask" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 全面背景 (マスカブル用: 余白なし) -->
  <rect width="512" height="512" fill="url(#bgGradMask)" />

  <!-- セーフゾーン内コンテンツ (中央80%エリア) -->
  <!-- 血糖目標帯ゾーン (70〜180 mg/dL ゾーン) -->
  <rect x="80" y="185" width="352" height="142" rx="16" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-dasharray="8 8" stroke-width="3" stroke-opacity="0.3" />

  <!-- CGM 24H 血糖連続測定曲線 -->
  <path d="M 90 290 C 130 290, 150 205, 190 210 C 230 215, 250 315, 290 305 C 330 295, 350 230, 390 235 C 410 237, 418 258, 424 262" 
        fill="none" 
        stroke="url(#waveGradMask)" 
        stroke-width="16" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glowMask)" />

  <!-- 測定点パルスポイント -->
  <circle cx="190" cy="210" r="14" fill="#10b981" stroke="#ffffff" stroke-width="5" />
  <circle cx="290" cy="305" r="11" fill="#38bdf8" stroke="#ffffff" stroke-width="4.5" />
  <circle cx="390" cy="235" r="12" fill="#f59e0b" stroke="#ffffff" stroke-width="4.5" />

  <!-- ドロップレット (血液・CGMセンサーの象徴) -->
  <path d="M 256 110 C 256 110, 280 144, 280 160 C 280 173, 269 184, 256 184 C 243 184, 232 173, 232 160 C 232 144, 256 110, 256 110 Z" 
        fill="#f43f5e" />
  <circle cx="250" cy="151" r="4.5" fill="#ffffff" fill-opacity="0.7" />
</svg>
